name: Backend Production

# Corre al hacer push a production, solo si hay cambios en /backend
on:
  push:
    branches: [production]
    paths:
      - "backend/**"
  workflow_dispatch: # permite correrla manualmente desde la pestaña Actions

jobs:
  deploy:
    # Corre en el self-hosted runner (la máquina donde vive el servidor).
    # Solo se dispara con push directo a production, no con PRs de forks.
    runs-on: [self-hosted, Windows]
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t reservas-api:latest .

      - name: Detener contenedor anterior (si existe)
        run: |
          docker stop reservas-api
          docker rm reservas-api
        continue-on-error: true

      - name: Levantar contenedor
        run: |
          docker run -d --name reservas-api `
            -p 8000:8000 `
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" `
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" `
            -e ALGORITHM="HS256" `
            -e ACCESS_TOKEN_EXPIRE_MINUTES="1440" `
            -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" `
            -e PROJECT_NAME="API de Reservas" `
            -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" `
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" `
            reservas-api:latest

# Prerrequisito: Docker Desktop (con backend WSL2) instalado y corriendo
# en la máquina del self-hosted runner.
#
# Secrets a crear en GitHub: Settings > Environments > production > Add secret
#   DATABASE_URL, SECRET_KEY, CORS_ORIGINS, ADMIN_EMAIL, ADMIN_PASSWORD
