name: Frontend QA

# Corre en cada push o PR contra la rama qa, solo si hay cambios en /frontend
on:
  push:
    branches: [qa]
    paths:
      - "frontend/**"
  pull_request:
    branches: [qa]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (type-check + vite build)
        run: npm run build
