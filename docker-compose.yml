# Entorno de desarrollo local: PostgreSQL + backend + frontend
#
# Uso:
#   docker compose up -d --build
#   docker compose exec backend python -m app.seed
#
# URLs:
#   Frontend  -> http://localhost:5173
#   API       -> http://localhost:8000
#   Swagger   -> http://localhost:8000/docs
#   Postgres  -> localhost:5433
#
# Los valores de este archivo son SOLO para desarrollo local.
# Las credenciales reales viven en Azure y en los secrets de GitHub.

services:
  db:
    image: postgres:17
    container_name: reservapp-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservas
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: reservapp-api-local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reservas
      SECRET_KEY: clave-solo-para-desarrollo-local-no-usar-en-produccion
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      PROJECT_NAME: API de Reservas
      ADMIN_EMAIL: admin@local.test
      ADMIN_PASSWORD: Local_Dev_2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: reservapp-web-local
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
